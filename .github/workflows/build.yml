name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: ubuntu-24.04 ships the Android SDK preinstalled (ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log
      # Surface compiler errors as annotations (visible on the run page).
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|^> |error:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FreeSplash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreeSplash-apk
          path: FreeSplash.apk

      # Rolling "latest" release so the APK is one tap away from your phone.
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeSplash (latest build)
          body: "Built from ${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: FreeSplash.apk
