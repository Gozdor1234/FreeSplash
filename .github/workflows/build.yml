name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FreeSplash.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FreeSplash-apk
          path: FreeSplash.apk

      # Rolling "latest" release so the APK is one tap away from your phone.
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FreeSplash (latest build)
          body: "Built from ${{ github.sha }}"
          prerelease: false
          make_latest: true
          files: FreeSplash.apk
